version: '3.8'

services:
  mock_erp:
    build:
      context: .
      dockerfile: mock_erp/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    volumes:
      - ./data:/app/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MOCK_LLM_MODE=true
      - MOCK_ERP_URL=http://mock_erp:8001
    depends_on:
      - mock_erp
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
